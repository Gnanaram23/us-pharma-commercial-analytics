# Downloads the public data for projects 05 (Open Payments) and 07 (Medicaid
# GLP-1 use by state) and commits it to the `data-v2` branch.
# Run from the Actions tab, or by pushing to the `data-fetch-v2` branch.
name: Fetch data for projects 05 and 07

on:
  workflow_dispatch:
  push:
    branches: [data-fetch-v2]

permissions:
  contents: write

jobs:
  openpayments:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        year: [2022, 2023, 2024]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          set -o pipefail
          python 05-omnichannel-hcp-engagement/fetch_data.py ${{ matrix.year }} 2>&1 | tee run.log || { tail -25 run.log | sed 's/^/::error::/'; exit 1; }
          tail -4 run.log | sed 's/^/::notice::/'
      - uses: actions/upload-artifact@v4
        with: { name: "op-${{ matrix.year }}", path: 05-omnichannel-hcp-engagement/data/raw }

  sdud:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          set -o pipefail
          python 07-test-and-control-experiments/fetch_data.py 2>&1 | tee run.log || { tail -25 run.log | sed 's/^/::error::/'; exit 1; }
          grep -E "SDUD|kept" run.log | sed 's/^/::notice::/'
      - uses: actions/upload-artifact@v4
        with: { name: sdud, path: 07-test-and-control-experiments/data/raw }

  commit:
    needs: [openpayments, sdud]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: _artifacts }
      - name: Place files and commit to data-v2
        run: |
          set -e
          mkdir -p 05-omnichannel-hcp-engagement/data/raw 07-test-and-control-experiments/data/raw
          for d in _artifacts/op-*; do [ -d "$d" ] && cp -r "$d"/. 05-omnichannel-hcp-engagement/data/raw/; done
          [ -d _artifacts/sdud ] && cp -r _artifacts/sdud/. 07-test-and-control-experiments/data/raw/
          rm -rf _artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B data-v2
          git add -A 05-omnichannel-hcp-engagement/data 07-test-and-control-experiments/data
          git commit -m "Data for projects 05 and 07 ($(date -u +%Y-%m-%d)) [skip ci]" || echo "nothing to commit"
          git push -f origin data-v2
