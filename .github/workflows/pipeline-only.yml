name: Pipeline fetch only
on:
  push:
    branches: [pipeline-refresh]
permissions:
  contents: write
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python 04-obesity-pipeline-intelligence/fetch_data.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B pipeline-data
          git add 04-obesity-pipeline-intelligence/data
          git commit -m "Pipeline data with trial summaries"
          git push -f origin pipeline-data
