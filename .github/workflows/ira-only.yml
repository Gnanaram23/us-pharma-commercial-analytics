name: IRA fetch only
on:
  push:
    branches: [ira-fetch]
permissions:
  contents: write
jobs:
  ira:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          set -o pipefail
          python 02-ira-negotiation-exposure/fetch_data.py 2>&1 | tee run.log || { tail -25 run.log | sed 's/^/::error::/'; exit 1; }
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ira-data
          git add 02-ira-negotiation-exposure/data
          git commit -m "IRA FDA lookups"
          git push -f origin ira-data
